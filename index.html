<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SAMAS — Client Demo</title>
    <meta name="description" content="SAMAS — simulador, cotizaciones y plan de inversion con IA." />
    <meta name="theme-color" content="#0D1117" />
    <!-- iOS add-to-home-screen: ask the browser to hide chrome and keep a
         native-like standalone appearance. No service worker is used since
         the app is a vite-plugin-singlefile build (already self-contained). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SAMAS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📈%3C/text%3E%3C/svg%3E" />
    <style>
      html, body, #root {
        margin: 0; padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      html { -webkit-text-size-adjust: 100%; }
      body { background: #050505; }
      /* On native (Capacitor) we want the app to fill the viewport AND
         have the dark theme extend under the iOS status bar / home
         indicator. `viewport-fit=cover` (set in the meta) lets us read
         env(safe-area-inset-*); we apply those insets as padding on
         #root so every descendant naturally lands inside the safe
         area. The background is set on body so the OS chrome zones
         show our brand color, not white. */
      #root {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        background: #050505;
        box-sizing: border-box;
      }
      /* Global box-sizing so width:100% + padding doesn't blow past the
         viewport. Fixes content overflowing the right edge on real
         iPhones — the fake-iPhone preview frame in the browser was
         wide enough to hide the bug, but on a real device the content
         clipped because some inner divs added padding ON TOP of width:100%. */
      *, *::before, *::after { box-sizing: border-box; }
      /* iOS auto-zooms when the user taps an input whose font-size
         is below 16px. Set 16px as the floor on every form control
         so the page never jumps. The viewport meta has user-scalable
         turned off too as a belt-and-suspenders. */
      input, textarea, select { font-size: 16px; }
      /* Disable double-tap zoom on tappable elements — on iOS the
         300ms wait for a possible second tap also creates a delay
         that feels laggy. */
      html { touch-action: manipulation; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
